services:
  mysql:
    image: mysql:8.4
    container_name: salao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salao
    ports:
      - "3307:3306"
    volumes:
      - salao_mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  salao_mysql_data:
